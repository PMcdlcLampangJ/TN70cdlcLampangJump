<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบสอบถามความต้องการและการพัฒนา - ศพช.ลำปาง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1b365d;
      --secondary: #c59b27;
      --accent-bg: #f4f7fb;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #dcdfe6;
      --error: #d9534f;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: var(--accent-bg);
      color: var(--text);
      margin: 0;
      padding: 24px 12px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border-top: 6px solid var(--primary);
    }

    header {
      padding: 30px;
      background: linear-gradient(135deg, #1b365d, #0f213d);
      color: #ffffff;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: 700;
      color: #ffd700;
    }

    header p {
      margin: 0;
      font-size: 16px;
      color: #e0e6ed;
    }

    form {
      padding: 30px;
    }

    .section-title {
      background-color: #f0f4f9;
      border-left: 5px solid var(--primary);
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin: 35px 0 20px 0;
      border-radius: 0 6px 6px 0;
    }

    .sub-section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--secondary);
      margin: 20px 0 10px 0;
      border-bottom: 2px dashed #eee;
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
      display: block;
    }

    .limit-hint {
      font-size: 13px;
      color: #666;
      font-weight: normal;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14.5px;
      cursor: pointer;
    }

    .option-item input[type="checkbox"],
    .option-item input[type="radio"] {
      margin-top: 4px;
      cursor: pointer;
      accent-color: var(--primary);
      min-width: 16px;
      min-height: 16px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14.5px;
      transition: border 0.3s;
      background: #fafafa;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.1);
    }

    .inline-input {
      border-bottom: 1px solid #999;
      border-top: none;
      border-left: none;
      border-right: none;
      border-radius: 0;
      padding: 2px 8px;
      background: transparent;
      display: inline-block;
      width: calc(100% - 70px);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), #2a5298);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 30px;
      box-shadow: 0 4px 10px rgba(27, 54, 93, 0.3);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #submission-status {
      display: none;
      padding: 16px;
      border-radius: 6px;
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
    }

    .status-success {
      background: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .status-loading {
      background: #e3f2fd;
      color: var(--primary);
      border: 1px solid #bbdefb;
    }

    .status-error {
      background: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>แบบสำรวจความต้องการและการพัฒนางาน</h1>
    <p>ศูนย์ศึกษาและพัฒนาชุมชนลำปาง</p>
  </header>

  <form id="surveyForm">

    <!-- ==================== ฝ่ายอำนวยการ ==================== -->
    <div class="section-title">ส่วนที่ 1: ฝ่ายอำนวยการ</div>

    <div class="form-group">
      <label class="form-label">1. ท่านต้องการให้ ศพช.ลำปาง ดำเนินการพัฒนาในลักษณะใดมากที่สุด <span class="limit-hint">(เลือกได้ไม่เกิน 3 ข้อ)</span></label>
      <div class="options-list" data-max="3">
        <label class="option-item"><input type="checkbox" name="admin_q1" value="ปรับปรุงอาคารและสถานที่"> ปรับปรุงอาคารและสถานที่</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="จัดหาอุปกรณ์และสิ่งอำนวยความสะดวกเพิ่มเติม"> จัดหาอุปกรณ์และสิ่งอำนวยความสะดวกเพิ่มเติม</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="พัฒนาคุณภาพอาหารและบริการ"> พัฒนาคุณภาพอาหารและบริการ</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="เพิ่มมาตรการความปลอดภัย"> เพิ่มมาตรการความปลอดภัย</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="พัฒนาคุณภาพเนื้อหาและกิจกรรมฐานเรียนรู้"> พัฒนาคุณภาพเนื้อหาและกิจกรรมฐานเรียนรู้</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="พัฒนาทักษะและมาตรฐานการให้บริการของเจ้าหน้าที่"> พัฒนาทักษะและมาตรฐานการให้บริการของเจ้าหน้าที่</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="นำเทคโนโลยีดิจิทัลมาเพิ่มประสิทธิภาพการให้บริการ"> นำเทคโนโลยีดิจิทัลมาเพิ่มประสิทธิภาพการให้บริการ</label>
        <label class="option-item"><input type="checkbox" name="admin_q1" value="พัฒนาระบบรับฟังความคิดเห็นและแก้ไขข้อร้องเรียน"> พัฒนาระบบรับฟังความคิดเห็นและแก้ไขข้อร้องเรียน</label>
        <div class="option-item" style="flex-wrap: wrap;">
          <label><input type="checkbox" name="admin_q1" value="อื่นๆ"> อื่น ๆ โปรดระบุ:</label>
          <input type="text" name="admin_q1_other" class="inline-input" placeholder="ระบุเพิ่มเติม...">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">2. หาก ศพช.ลำปาง สามารถดำเนินการปรับปรุงมาตรฐานการให้บริการได้ทันที 1 เรื่อง ท่านต้องการให้ปรับปรุงเรื่องใดมากที่สุด</label>
      <textarea name="admin_q2" rows="2" placeholder="ระบุเรื่องที่ต้องการให้ปรับปรุงมากที่สุด..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">3. ท่านมีข้อเสนอแนะเพิ่มเติมเพื่อยกระดับมาตรฐานการให้บริการของ ศพช.ลำปาง อย่างไร</label>
      <textarea name="admin_q3" rows="2" placeholder="ข้อเสนอแนะเพิ่มเติม..."></textarea>
    </div>

    <div class="sub-section-title">ข้อเสนอแนะรายด้าน</div>

    <div class="form-group">
      <label class="form-label">1. ด้านห้องฝึกอบรม: ควรมีสิ่งอำนวยความสะดวกหรือเทคโนโลยีใดเพิ่มเติม เพื่อสนับสนุนการเรียนรู้ให้มีประสิทธิภาพมากขึ้น</label>
      <textarea name="admin_facility_training" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">2. ด้านห้องอาหาร: ควรมีสิ่งอำนวยความสะดวกใดเพิ่มเติม และมีข้อเสนอแนะเกี่ยวกับเมนูอาหารและรูปแบบการให้บริการอย่างไร</label>
      <textarea name="admin_facility_canteen" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">3. ด้านอาคารที่พัก: สิ่งอำนวยความสะดวกใดในห้องพักมีความจำเป็นต้องปรับปรุงหรือเพิ่มเติมมากที่สุด และมีข้อเสนอแนะอย่างไรเพื่อให้การพักค้างคืนสะดวกสบายขึ้น</label>
      <textarea name="admin_facility_room" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">4. ด้านความปลอดภัย: ท่านต้องการให้ ศพช.ลำปาง เพิ่มมาตรการหรือบริการด้านความปลอดภัยเรื่องใดเป็นพิเศษ</label>
      <textarea name="admin_facility_safety" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">5. ด้านฐานเรียนรู้: ท่านต้องการให้เพิ่มกิจกรรมฝึกปฏิบัติจริง กิจกรรมจำลองสถานการณ์ หรือสื่อดิจิทัลรูปแบบใด</label>
      <textarea name="admin_facility_base" rows="2"></textarea>
    </div>


    <!-- ==================== กลุ่มงานบริการทางวิชาการ ==================== -->
    <div class="section-title">ส่วนที่ 2: กลุ่มงานบริการทางวิชาการ</div>

    <div class="form-group">
      <label class="form-label">1. จากภารกิจงานที่ท่านได้รับมอบหมาย งานใดที่ท่านพบปัญหา อุปสรรค มีความกดดัน หรือรู้สึกว่า "ยังขาดความมั่นใจ" ในการปฏิบัติงานมากที่สุด <span class="limit-hint">(เลือกได้สูงสุด 3 ข้อ)</span></label>
      <div class="options-list" data-max="3">
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การจัดทำและขับเคลื่อนแผนชุมชน / แผนพัฒนาตำบล"> การจัดทำและขับเคลื่อนแผนชุมชน / แผนพัฒนาตำบล</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การพัฒนาและเสริมสร้างศักยภาพผู้นำชุมชน ผู้นำสตรี และแกนนำอช. / อช."> การพัฒนาและเสริมสร้างศักยภาพผู้นำชุมชน ผู้นำสตรี และแกนนำอช. / อช.</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การส่งเสริมและพัฒนาเศรษฐกิจฐานราก ธุรกิจชุมชน และการพัฒนาผลิตภัณฑ์ OTOP"> การส่งเสริมและพัฒนาเศรษฐกิจฐานราก ธุรกิจชุมชน และการพัฒนาผลิตภัณฑ์ OTOP</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การบริหารจัดการกองทุนชุมชน"> การบริหารจัดการกองทุนชุมชน</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การขับเคลื่อนการพัฒนาพื้นที่ตามหลักปรัชญาของเศรษฐกิจพอเพียง / โคก หนอง นา / ศูนย์เรียนรู้"> การขับเคลื่อนการพัฒนาพื้นที่ตามหลักปรัชญาของเศรษฐกิจพอเพียง / โคก หนอง นา / ศูนย์เรียนรู้</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การขับเคลื่อนการขจัดความยากจนและการพัฒนาคนทุกช่วงวัย"> การขับเคลื่อนการขจัดความยากจนและการพัฒนาคนทุกช่วงวัย</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การสร้างเครือข่ายและประสานการทำงานร่วมกับ 7 ภาคีเครือข่าย"> การสร้างเครือข่ายและประสานการทำงานร่วมกับ 7 ภาคีเครือข่าย</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การจัดทำและบริหารโครงการงบประมาณตามแผนปฏิบัติราชการ"> การจัดทำและบริหารโครงการงบประมาณตามแผนปฏิบัติราชการ</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การบริหารจัดการและใช้ประโยชน์ข้อมูลสารสนเทศ (กชช.2ค, จปฐ., CDD AI)"> การบริหารจัดการและใช้ประโยชน์ข้อมูลสารสนเทศ (กชช.2ค, จปฐ., CDD AI)</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="งานสื่อสาร ประชาสัมพันธ์ และการสร้างภาพลักษณ์ภารกิจ พช."> งานสื่อสาร ประชาสัมพันธ์ และการสร้างภาพลักษณ์ภารกิจ พช.</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="งานกองทุนพัฒนาบทบาทสตรี"> งานกองทุนพัฒนาบทบาทสตรี</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="งานด้านสารบรรณ ธุรการ พัสดุ และการเงิน"> งานด้านสารบรรณ ธุรการ พัสดุ และการเงิน</label>
        <label class="option-item"><input type="checkbox" name="acad_q1" value="การส่งเสริมกระบวนการมีส่วนร่วม / จัดเวทีประชาคม / วิทยากรกระบวนการ / พิธีกรงานสำคัญ"> การส่งเสริมกระบวนการมีส่วนร่วม / จัดเวทีประชาคม / วิทยากรกระบวนการ / พิธีกรงานสำคัญ</label>
        <div class="option-item" style="flex-wrap: wrap;">
          <label><input type="checkbox" name="acad_q1" value="อื่นๆ"> อื่น ๆ:</label>
          <input type="text" name="acad_q1_other" class="inline-input" placeholder="ระบุ...">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">2. หาก ศพช.ลำปาง จัดทำแผนฝึกอบรมประจำปีงบประมาณต่อไป ท่านต้องการพัฒนาตนเองในด้านใดบ้าง <span class="limit-hint">(เลือกได้สูงสุด 3 ข้อ)</span></label>
      <div class="options-list" data-max="3">
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านเทคโนโลยีดิจิทัลและปัญญาประดิษฐ์เพื่อการทำงาน (Digital & AI Tools)"> ด้านเทคโนโลยีดิจิทัลและปัญญาประดิษฐ์เพื่อการทำงาน (Digital & AI Tools)</label>
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านการพัฒนาและขับเคลื่อนเศรษฐกิจฐานราก / OTOP เชิงพาณิชย์และออนไลน์"> ด้านการพัฒนาและขับเคลื่อนเศรษฐกิจฐานราก / OTOP เชิงพาณิชย์และออนไลน์</label>
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านกระบวนการมีส่วนร่วม วิทยากรกระบวนการ และการถอดบทเรียน / KM"> ด้านกระบวนการมีส่วนร่วม วิทยากรกระบวนการ และการถอดบทเรียน / KM</label>
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านการบริหารจัดการโครงการ / การจัดทำแผนชุมชน"> ด้านการบริหารจัดการโครงการ / การจัดทำแผนชุมชน</label>
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านการสื่อสาร การนำเสนอ การสร้างคอนเทนต์ และการประชาสัมพันธ์งานพัฒนาชุมชน"> ด้านการสื่อสาร การนำเสนอ การสร้างคอนเทนต์ และการประชาสัมพันธ์งานพัฒนาชุมชน</label>
        <label class="option-item"><input type="checkbox" name="acad_q2" value="ด้านนวัตกรรมชุมชน การคิดเชิงออกแบบ"> ด้านนวัตกรรมชุมชน การคิดเชิงออกแบบ</label>

      <textarea name="research_q10" rows="3" placeholder="ระบุภารกิจ ปัญหา หรือข้อเสนอแนะนวัตกรรม..."></textarea>

    <button type="submit" id="submitBtn" class="btn-submit">บันทึกข้อมูลแบบสำรวจ</button>

<script>
  // ระบบจำกัดจำนวนตัวเลือก checkbox ตาม data-max
  document.querySelectorAll('.options-list[data-max]').forEach(group => {
    const max = parseInt(group.getAttribute('data-max'));
    const checkboxes = group.querySelectorAll('input[type="checkbox"]');
    
    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const checkedCount = group.querySelectorAll('input[type="checkbox"]:checked').length;
        if (checkedCount >= max) {
          checkboxes.forEach(item => {
            if (!item.checked) item.disabled = true;
          });
        } else {
          checkboxes.forEach(item => item.disabled = false);
        }
      });
    });
  });

  // URL Google Web App
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqsEcYJ80_9bdA3rwNUSqSLKV9vNlHaOD5LGj_6jOnNiVFD4blsTdW6_SKXEDAKpoE/exec';

  const form = document.getElementById('surveyForm');
  const statusBox = document.getElementById('submission-status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    // แสดงสถานะกำลังบันทึก
    submitBtn.disabled = true;
    statusBox.className = 'status-loading';
    statusBox.style.display = 'block';
    statusBox.innerText = 'กำลังบันทึกข้อมูล กรุณารอสักครู่...';

    // รวบรวมข้อมูลทั้งหมดเป็น Object JSON (จัดการทั้ง Checkbox และข้อความ)
    const formData = new FormData(form);
    const dataObj = {};

    formData.forEach((value, key) => {
      if (dataObj[key]) {
        // หากเป็น checkbox ที่เลือกได้หลายตัว ให้คั่นด้วยเครื่องหมายจุลภาค
        dataObj[key] = dataObj[key] + ', ' + value;
      } else {
        dataObj[key] = value;
      }
    });

    // ส่งข้อมูลแบบ POST ด้วยโหมด no-cors (เพื่อป้องกันปัญหาเรื่องเบราว์เซอร์บล็อกข้อมูล)
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(dataObj)
    })
    .then(() => {
      statusBox.className = 'status-success';
      statusBox.innerText = '✅ บันทึกข้อมูลแบบสำรวจของ ศพช.ลำปาง เรียบร้อยแล้ว ขอบคุณสำหรับข้อมูลครับ';
      form.reset();
      submitBtn.disabled = false;
      
      // ปลดล็อก checkbox ทุกช่องกลับคืนสภาพเดิม
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.disabled = false);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    })
    .catch(error => {
      submitBtn.disabled = false;
      statusBox.className = 'status-error';
      statusBox.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง';
    });
  });
</script>
