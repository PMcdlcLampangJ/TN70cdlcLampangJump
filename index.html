<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบสอบถามความต้องการและการพัฒนา - ศพช.ลำปาง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1b365d;
      --secondary: #c59b27;
      --accent-bg: #f4f7fb;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #dcdfe6;
      --error: #d9534f;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: var(--accent-bg);
      color: var(--text);
      margin: 0;
      padding: 24px 12px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border-top: 6px solid var(--primary);
    }

    header {
      padding: 30px;
      background: linear-gradient(135deg, #1b365d, #0f213d);
      color: #ffffff;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: 700;
      color: #ffd700;
    }

    header p {
      margin: 0;
      font-size: 16px;
      color: #e0e6ed;
    }

    form {
      padding: 30px;
    }

    .section-title {
      background-color: #f0f4f9;
      border-left: 5px solid var(--primary);
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin: 35px 0 20px 0;
      border-radius: 0 6px 6px 0;
    }

    .sub-section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--secondary);
      margin: 20px 0 10px 0;
      border-bottom: 2px dashed #eee;
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
      display: block;
    }

    .limit-hint {
      font-size: 13px;
      color: #666;
      font-weight: normal;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14.5px;
      cursor: pointer;
    }

    .option-item input[type="checkbox"],
    .option-item input[type="radio"] {
      margin-top: 4px;
      cursor: pointer;
      accent-color: var(--primary);
      min-width: 16px;
      min-height: 16px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14.5px;
      transition: border 0.3s;
      background: #fafafa;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.1);
    }

    .inline-input {
      border-bottom: 1px solid #999;
      border-top: none;
      border-left: none;
      border-right: none;
      border-radius: 0;
      padding: 2px 8px;
      background: transparent;
      display: inline-block;
      width: calc(100% - 70px);
    }

      background: linear-gradient(135deg, var(--primary), #2a5298);
      color: #ffffff;
